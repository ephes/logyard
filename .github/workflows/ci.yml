name: Dashboard assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate provisioned dashboard
        run: python3 -m scripts.check_dashboard
      - name: Run offline asset and query regressions
        run: python3 -m unittest discover -s tests -v
